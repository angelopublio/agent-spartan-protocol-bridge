name: CI

# Every pushed ref, not only the default branch: a shape violation that reaches
# a public remote is already published, so the check exists to detect a
# regression wherever it lands, never to prevent publication.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to immutable revisions and recorded in
      # docs/PROVENANCE.md. A tag is mutable; a commit is not.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
